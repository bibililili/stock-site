<style>
:root {
  --paper: #f2f4f6;
  --sheet: #ffffff;
  --ink: #18202a;
  --muted: #5d6a77;
  --rule: #d7dde3;
  --track: #e6eaee;
  --up: #c4352b;
  --down: #12845a;
  --link: #2c4a9a;
  --note-bg: #f7f8fa;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141a21;
    --sheet: #1b232c;
    --ink: #e4e9ee;
    --muted: #93a0ad;
    --rule: #2c3743;
    --track: #26303b;
    --up: #ff6a5c;
    --down: #3cc58c;
    --link: #8fa8ee;
    --note-bg: #18202a;
  }
}
:root[data-theme="dark"] {
  --paper: #141a21;
  --sheet: #1b232c;
  --ink: #e4e9ee;
  --muted: #93a0ad;
  --rule: #2c3743;
  --track: #26303b;
  --up: #ff6a5c;
  --down: #3cc58c;
  --link: #8fa8ee;
  --note-bg: #18202a;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  font-size: 16px;
  line-height: 1.6;
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
a { color: var(--link); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 3px; }

.wrap { max-width: 760px; margin: 0 auto; padding: 28px 16px 56px; }

/* masthead */
.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mast h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
.mast h1 span { color: var(--muted); font-weight: 400; margin-left: 6px; }
.mast .stamp { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.phase { font-size: 12px; color: var(--ink); border: 1px solid var(--rule); border-radius: 999px; padding: 0 9px; line-height: 20px; background: var(--sheet); }

/* 快讯与研报 */
.feed { margin: 28px 0 0; }
.feed h2 { font-size: 18px; margin: 0 0 4px; }
.feed .hint { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.news { list-style: none; margin: 0; padding: 0; }
.news li { display: grid; grid-template-columns: 6.2em 1fr; gap: 0 12px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.news li:last-child { border-bottom: 0; }
.news time { color: var(--muted); font-size: 13px; padding-top: 2px; }
.news .src { color: var(--muted); font-size: 12px; margin-left: 6px; white-space: nowrap; }
.news .where { color: var(--muted); font-size: 13px; }

/* 三大块：左右滑动卡片 */
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; margin: 0 0 12px; background: var(--track); border-radius: 10px; }
.tab { font: inherit; border: 0; background: transparent; color: var(--muted); border-radius: 7px; padding: 7px 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.tab .tab-name { font-size: 15px; font-weight: 600; white-space: nowrap; }
.tab .tab-sub { font-size: 12px; white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.tab:focus-visible { outline: 2px solid var(--link); outline-offset: 1px; }
.deck { display: flex; align-items: flex-start; gap: 16px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.deck::-webkit-scrollbar { display: none; }
.deck > section.mkt { flex: 0 0 100%; min-width: 0; margin: 0; scroll-snap-align: start; scroll-snap-stop: always; }
.dots { display: flex; justify-content: center; gap: 6px; margin: 10px 0 0; }
.dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--rule); }
.dots span.on { background: var(--muted); }
@media (prefers-reduced-motion: no-preference) {
  .deck { transition: height .25s ease; }
}

/* 接下来几小时：情景推演 */
.mkt .outlook { margin: 0 -18px; padding: 16px 18px 6px; border-top: 1px solid var(--rule); }
.outlook-solo .outlook { margin: 28px 0 0; }
.ol-title { font-size: 17px; margin: 0 0 4px; }
.notes:not(:last-child) { border-radius: 0; }
.mkt .ol-card { background: var(--note-bg); }
.outlook .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.ol-card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
.ol-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
.ol-head h4 { margin: 0; font-size: 16px; }
.ol-head .bias { font-size: 12px; border: 1px solid var(--rule); border-radius: 999px; padding: 0 9px; line-height: 20px; }
.ol-head .bias.up { border-color: var(--up); }
.ol-head .bias.down { border-color: var(--down); }
.ol-head .horizon { font-size: 13px; color: var(--muted); }
.ol-card p.now { margin: 0 0 10px; font-size: 15px; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 10px; padding: 10px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.levels .k { font-size: 12px; color: var(--muted); }
.levels ul { margin: 2px 0 0; padding: 0; list-style: none; font-size: 15px; }
.levels .res li { color: var(--up); }
.levels .sup li { color: var(--down); }
.ol-card .sub-h { font-size: 13px; color: var(--muted); margin: 8px 0 2px; }
.ol-card ul.plain { margin: 0; padding-left: 1.1em; font-size: 15px; }
.ol-card ul.plain li { margin: 3px 0; }

/* 存档 */
.mast h1 a.home { color: inherit; text-decoration: none; }
.archive-note { margin: 14px 0 0; padding: 10px 14px; background: var(--sheet); border: 1px solid var(--rule); border-left: 3px solid var(--link); border-radius: 6px; font-size: 14px; }
.archive-note a { margin-left: 6px; }
.archive h2 { font-size: 18px; margin: 32px 0 4px; }
.archive .hint { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.archive-list { list-style: none; margin: 0; padding: 0; }
.archive-list a { display: grid; grid-template-columns: 10.5em 1fr; gap: 0 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); color: inherit; text-decoration: none; font-size: 15px; }
.archive-list a:hover .what { text-decoration: underline; }
.archive-list a[aria-current="page"] { font-weight: 650; }
.archive-list .when { color: var(--muted); font-size: 13px; padding-top: 2px; }
.show-all { margin-top: 10px; font: inherit; font-size: 14px; color: var(--link); background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
@media (max-width: 560px) {
  .archive-list a { grid-template-columns: 1fr; }
}
.reports { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.reports li { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; }
.reports .by { font-size: 12px; color: var(--muted); }
.reports h3 { margin: 2px 0 4px; font-size: 16px; font-weight: 650; }
.reports p { margin: 0; font-size: 15px; }
.reports .stance { display: inline-block; font-size: 12px; border: 1px solid var(--rule); border-radius: 4px; padding: 0 6px; margin-left: 6px; color: var(--muted); font-weight: 400; vertical-align: 1px; }

.lede { margin: 22px 0 6px; font-size: clamp(22px, 5.4vw, 30px); line-height: 1.35; font-weight: 650; letter-spacing: -0.005em; }
.sub { margin: 0 0 28px; color: var(--muted); font-size: 15px; }

/* overnight sequence: the one memorable element */
.seq { position: relative; margin: 0 0 36px; padding: 0; list-style: none; }
.seq::before { content: ""; position: absolute; left: 52px; top: 8px; bottom: 8px; width: 2px; background: var(--rule); }
.seq li { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 0 22px; padding: 7px 0; }
.seq time { font-size: 14px; color: var(--muted); text-align: right; padding-top: 1px; }
.seq li::after { content: ""; position: absolute; left: 48px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--sheet); border: 2px solid var(--muted); }
.seq li.us::after { border-color: var(--link); }
.seq li.cn::after { border-color: var(--ink); }
.seq li.hit::after { background: var(--down); border-color: var(--down); }
.seq p { margin: 0; font-size: 15px; }
.seq .where { color: var(--muted); font-size: 13px; margin-right: 6px; }

/* market blocks */
section.mkt { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 18px 8px; margin-bottom: 20px; }
.mkt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.mkt-head h2 { margin: 0; font-size: 20px; font-weight: 650; }
.mkt-head .when { font-size: 13px; color: var(--muted); }

.scale { display: grid; grid-template-columns: 1fr var(--barw); font-size: 12px; color: var(--muted); padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
.scale .ticks { display: flex; justify-content: space-between; }
:root { --barw: 200px; }

.row { display: grid; grid-template-columns: 1fr auto auto var(--barw); align-items: center; gap: 0 16px; padding: 11px 0; border-bottom: 1px solid var(--rule); }
.row:last-of-type { border-bottom: 0; }
.row .name { font-weight: 600; font-size: 16px; }
.row .name small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.row .close { font-size: 17px; text-align: right; }
.row .close sup { color: var(--muted); font-size: 11px; margin-left: 1px; }
.row .chg { text-align: right; min-width: 5.6em; }
.row .chg b { display: block; font-size: 16px; font-weight: 650; }
.row .chg i { font-style: normal; font-size: 12px; }
.up { color: var(--up); }
.down { color: var(--down); }

.bar { position: relative; height: 10px; background: var(--track); border-radius: 2px; }
.bar::before { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
.bar span { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
.bar span.up { background: var(--up); left: 50%; }
.bar span.down { background: var(--down); right: 50%; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 14px 0 6px; padding-top: 14px; border-top: 1px solid var(--rule); }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 650; }
.stat .n { font-size: 13px; color: var(--muted); }
.breadth { display: flex; height: 8px; border-radius: 2px; overflow: hidden; margin-top: 6px; background: var(--track); }
.breadth .u { background: var(--up); }
.breadth .d { background: var(--down); }

.notes { margin: 14px -18px 0; padding: 14px 18px 16px; background: var(--note-bg); border-top: 1px solid var(--rule); border-radius: 0 0 10px 10px; }
.notes ul { margin: 0; padding-left: 1.1em; }
.notes li { margin: 5px 0; font-size: 15px; }
.notes li::marker { color: var(--muted); }

.link-box { margin: 28px 0; }
.link-box h2 { font-size: 18px; margin: 0 0 8px; }
.link-box p { margin: 0 0 10px; max-width: 40em; }
.watch { color: var(--muted); font-size: 15px; }

.hist h2 { font-size: 18px; margin: 32px 0 8px; }
.hist .hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.hist-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.hist-table th, .hist-table td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.hist-table th:first-child, .hist-table td:first-child { text-align: left; }
.hist-table thead th { color: var(--muted); font-weight: 500; font-size: 13px; }
.hist-scroll { overflow-x: auto; }
.spark { display: block; margin-left: auto; }

footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 8px; }
footer ul { margin: 6px 0 12px; padding-left: 1.1em; }

@media (max-width: 560px) {
  :root { --barw: 100%; }
  section.mkt { padding: 16px 14px 6px; }
  .notes { margin: 12px -14px 0; padding: 12px 14px 14px; }
  .mkt .outlook { margin: 0 -14px; padding: 14px 14px 4px; }
  .ol-card { padding: 12px 12px; }
  .scale { display: none; }
  .row { grid-template-columns: 1fr auto auto; gap: 6px 14px; }
  .row .bar { grid-column: 1 / -1; height: 6px; }
  .seq::before { left: 46px; }
  .seq li { grid-template-columns: 38px 1fr; gap: 0 20px; }
  .seq li::after { left: 42px; }
  .news li { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar span { transition: width .6s ease-out; }
}
</style>
</head>

  // 研报观点
  if (data.reports && data.reports.length) {
    h.push('<section class="feed"><h2>研报观点</h2><p class="hint">券商研究观点的摘要，不代表本页立场，也不构成投资建议。</p><ul class="reports">');
    data.reports.forEach(function (r) {
      var by = esc(r.date) + '　' + esc(r.org) + (r.author ? '　' + esc(r.author) : '');
      h.push('<li><div class="by num">' + by + '</div><h3>' + esc(r.title) + (r.stance ? '<span class="stance">' + esc(r.stance) + '</span>' : '') + '</h3>' +
        '<p>' + esc(r.summary) + (r.url ? ' <a href="' + esc(r.url) + '" target="_blank" rel="noopener">来源</a>' : '') + '</p></li>');
    });
    h.push('</ul></section>');
  }

  // 历史收盘：每天自动追加一列
  var hs = data.history;
  var showSpark = hs.dates.length >= 5;
  function spark(vals) {
    var pts = [];
    vals.forEach(function (v, i) { if (v !== null) pts.push([i, v]); });
    if (pts.length < 2) return '';
    var W = 84, H = 24, n = vals.length - 1;
    var lo = Math.min.apply(null, pts.map(function (p) { return p[1]; }));
    var hi = Math.max.apply(null, pts.map(function (p) { return p[1]; }));
    var span = hi - lo || 1;
    var path = pts.map(function (p) {
      return (p[0] / n * (W - 4) + 2).toFixed(1) + ',' + (H - 2 - (p[1] - lo) / span * (H - 4)).toFixed(1);
    }).join(' ');
    var cls = dir(pts[pts.length - 1][1] - pts[0][1]);
    return '<svg class="spark ' + cls + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true"><polyline points="' + path + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }
  var hint = showSpark ? '最近 ' + hs.dates.length + ' 个交易日，走势线按区间首尾涨跌着色。' : '每个交易日自动追加一列，攒够 5 个交易日后显示走势线。';
  h.push('<section class="hist"><h2>近几日收盘</h2><p class="hint">' + hint + '</p><div class="hist-scroll"><table class="hist-table num"><thead><tr><th>指数</th>');
  if (showSpark) h.push('<th>走势</th>');
  hs.dates.forEach(function (d) { h.push('<th>' + esc(d) + '</th>'); });
  h.push('</tr></thead><tbody>');
  hs.rows.forEach(function (r) {
    h.push('<tr><td>' + esc(r.name) + '</td>');
    if (showSpark) h.push('<td>' + spark(r.v) + '</td>');
    r.v.forEach(function (v, i) {
      var prev = i > 0 ? r.v[i - 1] : null;
      var cls = (v !== null && prev !== null) ? dir(v - prev) : '';
      h.push('<td class="' + cls + '">' + fmt(v, 2) + '</td>');
    });
    h.push('</tr>');
  });
  h.push('</tbody></table></div></section>');

  h.push('<section class="archive" id="archive" hidden></section>');

  h.push('<footer><p>红色为涨、绿色为跌。涨跌幅条两个市场共用 ±5% 刻度，可以直接比较力度。</p>' +
         '<p>数据整理自公开财经资讯，可能存在误差，仅作个人研究记录，不构成投资建议。</p>');
  var flagged = [];
  data.markets.forEach(function (m) { m.indices.forEach(function (ix) { if (ix.flag) flagged.push(ix.name + '：' + ix.flag); }); });
  if (flagged.length) h.push('<p>* ' + flagged.map(esc).join('；') + '</p>');
  h.push('<p>今日来源：</p><ul>');
  data.sources.forEach(function (s) { h.push('<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a></li>'); });
  h.push('</ul></footer>');

  document.getElementById('app').innerHTML = h.join('');
  document.title = snapId ? '盘后指数 ' + snapLabel(snapId) : '盘后指数';
  window.scrollTo(0, 0);
  initDeck();
  loadArchive(snapId);
  }

  function initDeck() {
    var deck = document.getElementById('deck');
    if (!deck) return;
    var slides = Array.prototype.slice.call(deck.children);
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tabs .tab'));
    var dots = Array.prototype.slice.call(document.querySelectorAll('.dots span'));
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var cur = -1, raf = 0;
    function step() { return slides.length > 1 ? slides[1].offsetLeft - slides[0].offsetLeft : deck.clientWidth; }
    function setActive(i) {
      i = Math.max(0, Math.min(slides.length - 1, i));
      deck.style.height = slides[i].offsetHeight + 'px';
      if (i === cur) return;
      cur = i;
      tabs.forEach(function (t, k) { t.setAttribute('aria-selected', k === i ? 'true' : 'false'); t.tabIndex = k === i ? 0 : -1; });
      dots.forEach(function (d, k) { d.className = k === i ? 'on' : ''; });
    }
    function go(i, focus) {
      deck.scrollTo({left: i * step(), behavior: reduce ? 'auto' : 'smooth'});
      setActive(i);
      if (focus) tabs[i].focus();
    }
    deck.addEventListener('scroll', function () {
      if (raf) return;
      raf = requestAnimationFrame(function () { raf = 0; setActive(Math.round(deck.scrollLeft / step())); });
    }, {passive: true});
    tabs.forEach(function (t, k) {
      t.addEventListener('click', function () { go(k); });
      t.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); go((k + 1) % tabs.length, true); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); go((k - 1 + tabs.length) % tabs.length, true); }
      });
    });
    window.addEventListener('resize', function () {
      var i = Math.max(cur, 0); cur = -1;
      deck.scrollLeft = i * step();
      setActive(i);
    });
    setActive(0);
  }

  function snapLabel(id) {
    var d = id.slice(0, 10), p = id.slice(11);
    var wd = new Date(d + 'T12:00:00+08:00').getDay();
    return Number(d.slice(5, 7)) + '月' + Number(d.slice(8, 10)) + '日 ' + WEEK[wd] + ' ' + (PHASE[p] || p);
  }

  // 往期记录：读取 archive/index.json，列出全部存档
  function loadArchive(current) {
    var box = document.getElementById('archive');
    fetch('archive/index.json', {cache: 'no-cache'})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (list) {
        list = (list || []).filter(function (e) { return e && SNAP_RE.test(e.id); });
        if (!list.length) return;
        var LIMIT = 15;
        var rows = list.map(function (e, i) {
          var cur = e.id === current ? ' aria-current="page"' : '';
          return '<li' + (i >= LIMIT ? ' class="more" hidden' : '') + '><a href="?d=' + esc(e.id) + '"' + cur + '>' +
            '<span class="when num">' + esc(snapLabel(e.id)) + '</span><span class="what">' + esc(e.headline || '') + '</span></a></li>';
        });
        box.innerHTML = '<h2>往期记录</h2><p class="hint">共 ' + list.length + ' 份存档，每次更新都会自动保存一份，点开可以看当时的完整页面。</p>' +
          '<ul class="archive-list">' + rows.join('') + '</ul>' +
          (list.length > LIMIT ? '<button type="button" class="show-all">显示全部 ' + list.length + ' 份</button>' : '');
        box.hidden = false;
        var btn = box.querySelector('.show-all');
        if (btn) btn.addEventListener('click', function () {
          box.querySelectorAll('li.more').forEach(function (li) { li.hidden = false; });
          btn.remove();
        });
      })
      .catch(function () { box.hidden = true; });
  }

  // 链接带 ?d=YYYY-MM-DD-phase 时打开对应存档，否则显示最新数据
  var want = new URLSearchParams(location.search).get('d');
  if (want && SNAP_RE.test(want)) {
    fetch('archive/' + want + '.json', {cache: 'no-cache'})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { render(d, want); })
      .catch(function () { render(inline, null, '没有找到这份存档，下面显示的是最新数据。'); });
  } else {
    render(inline, null);
  }
})();
</script>
</body>
</html>
